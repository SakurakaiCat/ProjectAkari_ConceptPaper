name: Build PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: XeLaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `make check` is a gate: undefined references, missing glyphs, and
      # overfull boxes fail the job rather than being silently accepted. It
      # exits non-zero, and the `&&` chain propagates that.
      - name: Build and verify
        uses: xu-cheng/texlive-action@v3
        with:
          scheme: full
          run: make && make check

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: concept-paper
          path: build/main.pdf
          if-no-files-found: error
